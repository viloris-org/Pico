version: 1
status: proposed

# This contract describes the intended target layout. Checks become blocking
# once the corresponding modules exist and CI has a boundary-check command.
modules:
  net:
    paths: ["src/net/**"]
    owner: runadb-core
    may_depend_on: [runtime, flow, util]
    owns_data: [connection_state]
    risk: protocol
  runtime:
    paths: ["src/runtime/**"]
    owner: runadb-core
    may_depend_on: [util]
    owns_data: [io_scheduler_state, completion_queues]
    risk: critical
  flow:
    paths: ["src/flow/**"]
    owner: runadb-core
    may_depend_on: [txn, catalog, storage, util]
    owns_data: [parsed_sources, query_ir, execution_state]
    risk: protocol
  txn:
    paths: ["src/txn/**"]
    owner: runadb-core
    may_depend_on: [catalog, storage, util]
    owns_data: [snapshots, write_sets]
    risk: critical
  commit:
    paths: ["src/commit/**"]
    owner: runadb-core
    may_depend_on: [txn, catalog, storage, util]
    owns_data: [commit_order, commit_queue]
    risk: critical
  catalog:
    paths: ["src/catalog/**"]
    owner: runadb-core
    may_depend_on: [storage, util]
    owns_data: [catalog_metadata]
    risk: critical
  storage:
    paths: ["src/storage/**"]
    owner: runadb-core
    may_depend_on: [util]
    owns_data: [wal, lsm_files, manifests, checkpoints, vfs_handles, pager_cache]
    risk: critical
  # Logical sub-areas inside storage (documentation / review seams; not yet
  # separate CI packages). Callers outside storage still depend on `storage`.
  # - vfs: data-directory fence, instance lock, positional I/O, atomic publish
  # - pager: fixed page frames, pin/unpin, dirty writeback (not user commit)
  # - wal / lsm / compaction: as in ARCHITECTURE.md
  util:
    paths: ["src/util/**"]
    owner: runadb-core
    may_depend_on: []
    owns_data: []
    risk: standard

data_writers:
  catalog_metadata: commit
  committed_logical_changes: commit
  lsm_manifest_publication: commit
  wal: commit
  connection_state: net
  io_scheduler_state: runtime

gates:
  dependency_cycles: 0
  forbidden_dependencies: 0
  multiple_data_writers: 0
  unknown_wal_format_replayed: 0
  complete_corrupt_wal_frames_replayed: 0
  unversioned_internal_format_breaks: 0
  real_client_protocol_suites: [official_runa_cli, official_runadb_driver]

change_classes:
  routine:
    max_modules: 2
    requires_adr: false
  architectural:
    requires_adr: true
    examples:
      - wal_or_manifest_format_change
      - durability_guarantee_change
      - commit_ordering_change
      - flow_or_ir_contract_change

validation:
  local:
    - zig build test
  required_before_durable_commit_claim:
    - crash_matrix_recovery_test
    - wal_format_and_checksum_test
    - runa_cli_integration_test
    - runadb_driver_integration_test
  required_before_lsm_release:
    - checkpoint_recovery_test
    - manifest_atomic_publication_test
    - compaction_snapshot_visibility_test
  required_for_vfs_and_pager:
    - vfs_path_fence_test
    - vfs_atomic_publish_test
    - pager_page_aligned_io_test
    - pager_static_cache_full_and_pin_test
  required_before_flow_mutation_execution:
    - source_ir_execution_parity_test
    - mutation_recovery_test
    - official_client_mutation_integration_test

budgets:
  # Calibrate against CI history before making these blocking.
  local_test_p95_seconds: 120
  required_ci_p95_seconds: 900
